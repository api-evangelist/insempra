name: Insempra
description: 'Insempra is a biotechnology company that produces sustainable, bio-based
  ingredients using precision fermentation. It develops alternatives to petrochemical
  and naturally-extracted ingredients for the beauty and personal care, food and nutrition,
  and fibers and performance materials industries. Products include a bio-based Phenyl
  Ethyl Alcohol fragrance ingredient, an Omega-7 biolipid, and Biomelanin (in development),
  produced from agricultural and forestry waste streams through circular manufacturing.
  Insempra is a portfolio company of EQT Ventures and is tracked in the API Evangelist
  network as a company profile; it publishes no public API or developer surface at
  this time.'
